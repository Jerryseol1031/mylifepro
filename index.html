<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로 노트</title>
<style>
  :root { --bg:#f7f6f3; --fg:#1f1f1f; --muted:#6b6b6b; --line:#e5e3de; --accent:#2f5d50; --soft:#eef3ef; --err:#b3261e; --warn:#8a5a00; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-size:14px;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width:460px; margin:0 auto; padding:16px 12px 72px; }
  h1 { font-size:19px; margin:0; letter-spacing:-0.5px; display:inline; }
  .sub { color:var(--muted); font-size:12px; margin-left:6px; }
  header { margin-bottom:10px; }
  button { font-family:inherit; cursor:pointer; }
  #login { width:100%; margin-top:12px; padding:13px; font-size:15px; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; }

  .단위들 { display:flex; background:var(--bg); border-radius:9px; padding:3px; margin-bottom:10px; }
  .단위들 button { flex:1; border:0; background:none; padding:6px 0; border-radius:7px; font-size:13px; color:var(--muted); }
  .단위들 button.골라짐 { background:#fff; color:var(--fg); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .날짜줄 { display:flex; align-items:center; gap:8px; }
  .날짜줄 .넘김 { width:34px; height:34px; flex:none; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13px; color:var(--fg); }
  .날짜 { flex:1; text-align:center; font-size:15px; font-weight:600; }
  .날짜 small { display:block; font-size:11px; font-weight:500; color:var(--muted); margin-top:1px; }
  .다른날 { margin-top:8px; padding:6px 10px; border-radius:8px; background:#fff4e0; color:var(--warn); font-size:12px; display:flex; justify-content:space-between; align-items:center; }
  .다른날 button { border:0; background:none; color:var(--accent); font-weight:600; font-size:12px; padding:0; }

  .영역머리 { display:flex; justify-content:space-between; align-items:baseline; }
  .영역이름 { font-size:14px; font-weight:700; }
  .달성률 { font-size:12px; color:var(--accent); font-weight:600; }

  .참고 { margin-top:8px; background:var(--soft); border-radius:8px; padding:6px 10px; font-size:12px; color:#3d4a44; }
  .참고머리 { display:flex; gap:6px; align-items:center; border:0; background:none; padding:2px 0; width:100%; text-align:left; font-size:12px; color:var(--accent); font-weight:600; }
  .참고머리 span { color:var(--muted); font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .참고제목 { font-weight:600; color:var(--muted); margin:6px 0 2px; }
  .참고줄 { line-height:1.55; padding-left:2px; }
  .참고줄 b { display:inline-block; width:14px; font-weight:400; color:var(--muted); }

  .주제 { font-size:11px; color:var(--muted); font-weight:600; margin:10px 0 0; display:flex; align-items:center; gap:5px; }
  .점 { display:inline-block; width:9px; height:9px; border-radius:50%; flex:none; }
  .점단추 { width:22px; height:22px; border:0; background:none; padding:0; display:flex; align-items:center; justify-content:center; flex:none; }
  .점단추 .점 { width:12px; height:12px; }

  /* 항목을 누르면 뜨는 주제 고르개 */
  .고르개 { margin-top:8px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
  .고르개제목 { font-size:11px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .칩줄 { display:flex; flex-wrap:wrap; gap:5px; }
  .칩 { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border:1px solid var(--line); border-radius:14px; background:#fff; font-size:13px; color:var(--fg); }
  .칩.골라짐 { border-color:var(--accent); background:var(--soft); font-weight:600; }
  .제안 { font-size:12px; margin-top:6px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .제안 button { border:0; background:none; color:var(--accent); font-weight:600; font-size:12px; padding:4px 0; flex:none; }

  /* 설정 화면 */
  .설정머리 { display:flex; justify-content:space-between; align-items:center; }
  .설정머리 h2 { font-size:17px; margin:0; }
  .닫기단추 { width:34px; height:34px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:15px; color:var(--fg); }
  #설정단추 { float:right; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13px; padding:5px 10px; color:var(--fg); }
  .묶음제목 { font-size:12px; font-weight:700; color:var(--muted); margin:14px 0 2px; }
  .묶음제목:first-of-type { margin-top:8px; }
  .설정줄 { display:flex; align-items:center; gap:6px; padding:7px 0; border-bottom:1px solid var(--line); min-height:40px; }
  .설정줄:last-child { border-bottom:0; }
  .설정줄 .이름 { flex:1; min-width:0; font-size:14px; word-break:break-word; }
  .설정줄 .곁 { font-size:12px; color:var(--muted); flex:none; }
  .네모단추 { width:30px; height:30px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--fg); font-size:12px; padding:0; flex:none; }
  .네모단추:disabled { opacity:.3; }
  .고치기틀 { padding:8px 0; border-bottom:1px solid var(--line); }
  .기간고르기 { display:flex; gap:4px; margin-top:6px; }
  .기간고르기 button { flex:1; padding:7px 0; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--muted); font-size:13px; }
  .기간고르기 button.골라짐 { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .단추줄 { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .색판 { display:flex; flex-wrap:wrap; gap:4px; padding:6px 0 8px 28px; }
  .색판 button { display:flex; align-items:center; gap:4px; padding:4px 8px; border:1px solid var(--line); border-radius:14px; background:#fff; font-size:12px; color:var(--fg); }
  .색판 button.골라짐 { border-color:var(--fg); font-weight:600; }
  .안내글 { font-size:12px; color:var(--muted); margin-top:4px; }
  .알려줌 { margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--soft); color:#3d4a44; font-size:13px; line-height:1.5; }
  .알려줌 button { display:block; margin:4px 0 0 auto; border:0; background:none; color:var(--accent); font-weight:600; font-size:12px; padding:0; }
  ul { list-style:none; margin:4px 0 0; padding:0; }
  /* 항목 하나 = 글 + 평가가 한 덩어리 (작은 상자) */
  li { padding:7px 8px 7px 10px; margin-top:6px; background:var(--bg); border:1px solid var(--line); border-radius:9px; }
  /* 주제 묶음 = 주제 색 막대로 묶는다. 제목을 누르면 이름 바꾸기·옮기기 */
  .묶음 { margin-top:12px; padding-left:10px; border-left:3px solid var(--line); }
  .묶음 > ul { margin-top:2px; }
  .묶음제목단추 { display:flex; align-items:center; gap:6px; border:0; background:none; padding:2px 0; font-size:13px; font-weight:700; color:var(--fg); }
  .묶음제목단추 .점 { width:10px; height:10px; }
  .묶음제목단추 .곁 { font-size:11px; font-weight:400; color:var(--muted); }
  .묶음메뉴 { margin-top:6px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .항목줄 { display:flex; align-items:center; gap:6px; }
  .항목글 { flex:1; min-width:0; font-size:14px; line-height:1.45; word-break:break-word; cursor:pointer; }
  .꼬리표 { display:inline-block; font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:0 4px; margin-left:4px; vertical-align:1px; }
  .평가들 { display:flex; gap:3px; flex:none; }
  .평가들 button { width:30px; height:30px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--muted); font-size:13px; padding:0; }
  .평가들 button.골라짐 { color:#fff; }
  .평가들 button.골라짐[aria-label="했다"]   { background:#3b73c4; border-color:#3b73c4; }
  .평가들 button.골라짐[aria-label="일부"]   { background:#e0a920; border-color:#e0a920; }
  .평가들 button.골라짐[aria-label="못했다"] { background:#d9534f; border-color:#d9534f; }
  .추가주제 { margin-top:6px; }
  .칸제목 { display:flex; justify-content:space-between; align-items:center; }
  .순서단추 { border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--accent); font-size:12px; font-weight:600; padding:3px 10px; }
  .묶음머리 { display:flex; align-items:center; gap:4px; }
  .묶음머리 .묶음제목단추 { flex:1; color:var(--fg); opacity:1; cursor:default; }
  .새주제칩 { border-style:dashed !important; color:var(--muted) !important; }
  .새주제줄 { display:flex; gap:5px; margin-top:6px; }
  .새주제줄 input { padding:6px 9px !important; font-size:13px !important; }
  .추가주제 .칩 { padding:4px 9px; font-size:12px; }
  .쪼개기 { font-size:11px; color:var(--warn); margin-top:3px; }

  .입력줄 { display:flex; gap:6px; margin-top:8px; }
  input[type=text], textarea { flex:1; min-width:0; width:100%; padding:9px 10px; font-size:14px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--fg); font-family:inherit; }
  textarea { resize:vertical; min-height:56px; line-height:1.45; display:block; }
  .작은단추 { padding:0 14px; min-height:38px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; flex:none; }
  .옅은단추 { padding:0 10px; min-height:38px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--fg); font-size:13px; flex:none; }
  .지우기단추 { color:var(--err); }
  .글자단추 { border:0; background:none; color:var(--accent); font-size:12px; padding:8px 0 0; }
  /* 계획·피드백은 영역 안의 구획 제목이다 — 점선으로 구획을 나누고, 색 막대와 굵은 글씨로 제목임을 보인다 */
  .칸제목 { font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.3px;
    margin:12px 0 6px; padding:10px 0 0 8px; border-top:1px dashed var(--line); position:relative; }
  .칸제목::before { content:''; position:absolute; left:0; top:11px; bottom:1px; width:3px; border-radius:2px; background:var(--accent); }
  .저장줄 { display:flex; justify-content:flex-end; margin-top:6px; }

  #msg { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:10; width:max-content; max-width:calc(100% - 24px);
    font-size:13px; line-height:1.5; }
  #msg > div { padding:7px 14px; border-radius:18px; box-shadow:0 2px 8px rgba(0,0,0,.15); background:#fff; }
  .err { color:var(--err); white-space:pre-wrap; font-size:12px; border-radius:10px !important; }
  .err .닫기 { display:block; margin:6px 0 0 auto; border:0; background:none; color:var(--accent); font-size:12px; font-weight:600; padding:0; }
  .step { color:var(--muted); }
  .ok { color:#fff; background:var(--accent) !important; }
</style>
</head>
<body>
<main>
  <header><h1>프로 노트</h1><span class="sub">나의 삶의 프로</span><button id="설정단추" style="display:none">설정</button></header>
  <button id="login" style="display:none">구글로 로그인</button>
  <div id="화면"></div>
  <div id="msg"><div class="step">불러오는 중…</div></div>
</main>

<script>
  const CLIENT_ID = '297972351948-2fq40d61rpp8dngqmg36mn5kqhnp2ebq.apps.googleusercontent.com';
  const SCOPE     = 'https://www.googleapis.com/auth/drive.file';
  const SHEET_NAME = '프로 노트 — 기록';
  const MARK_KEY = 'pronote', MARK_VALUE = 'sheet';
  const 출입증키 = 'pronote_token';
  // 사용 승인 (설계 3-3). 접수 창구에는 「이메일만 든 출입증」만 보낸다 — 기록용 출입증(token)은 절대 보내지 않는다 (8j.1)
  const 창구주소 = 'https://script.google.com/macros/s/AKfycbyrFHPBJDViZfOjJYyiS_hwJwjDqOPnwGgbv1rTk1DA0-U0rhyY91oBsuAXRqDCgZD2/exec';
  const 이메일범위 = 'email';
  const 승인키 = 'pronote_승인';   // 오늘 이미 승인받았으면 다시 묻지 않는다 (하루 한 번 — 8j.2)

  const TABS = [
    ['로드맵',   ['연도','비전','미션','꿈꾸는 삶의 모습','3년 후','1년 후','수정시각']],
    ['피드백',   ['피드백ID','기간 단위','기간','영역ID','영역','피드백','수정시각','삭제됨']],
    ['계획항목', ['항목ID','기간 단위','기간','영역ID','영역','주제ID','주제','계획','평가','평가메모','이월횟수','순서','수정시각','삭제됨']],
    ['일기',     ['일기ID','기간 단위','기간','내용','수정시각','삭제됨']],
    ['영역설정', ['영역ID','이름','기본/커스텀','일','주','분기','연','순서','수정시각','삭제됨']],
    ['주제설정', ['주제ID','이름','구분','상태','색','순서','수정시각','삭제됨']],
    ['핵심문제', ['핵심문제ID','기간 단위','기간','내용','수정시각','삭제됨']]
  ];
  function 기본영역행들(now) {
    return [
      ['base_action','실행 초점','기본','O','O','O','O',1,now,''],
      ['base_constitution','체질 초점','기본','O','O','O','O',2,now,''],
      ['base_goal','핵심 목표','기본','','','O','O',3,now,'']
    ];
  }
  // 앱이 읽고 쓰는 칸. 첫 줄에서 이름으로 찾고, 하나라도 없으면 저장하지 않는다 (원칙 6)
  const 필요칸 = {
    '영역설정': ['영역ID','이름','기본/커스텀','일','주','분기','연','순서','수정시각','삭제됨'],
    '주제설정': ['주제ID','이름','구분','상태','색','순서','수정시각','삭제됨'],
    '계획항목': ['항목ID','기간 단위','기간','영역ID','영역','주제ID','주제','계획','평가','이월횟수','순서','수정시각','삭제됨'],
    '피드백':   ['피드백ID','기간 단위','기간','영역ID','영역','피드백','수정시각','삭제됨'],
    '일기':     ['일기ID','기간 단위','기간','내용','수정시각','삭제됨']
  };
  // 시트에는 한글로, 화면에는 기호로 (설계 5-5)
  const 평가모양 = [['했다','○'],['일부','△'],['못했다','✕']];
  const 평가점수 = { '했다':1, '일부':0.5, '못했다':0 };
  const 기간종류 = [['일','일간'],['주','주간'],['분기','분기'],['연','연간']];

  // 주제는 영역이 아니라 「구분」에 속한다. 핵심 목표·실행 초점은 한 구분을 함께 쓴다 (설계 5-7-1)
  const 기본구분 = { base_action:'목표·실행', base_goal:'목표·실행', base_constitution:'체질' };
  const 영역구분 = 영역ID => 기본구분[영역ID] || 영역ID;
  // 주제 색 — 시트에는 한글 이름, 화면에는 색조. 색조는 [4-4]에서 바꿔도 기록은 그대로다 (8h.10)
  const 색들 = [['빨강','#d9534f'],['주황','#e8833a'],['노랑','#d4a72c'],['초록','#4a9b5f'],
                ['청록','#2a9d8f'],['파랑','#3b73c4'],['보라','#7d5bbf'],['분홍','#d6699c']];

  const loginBtn = document.getElementById('login');
  const 화면 = document.getElementById('화면');
  const msg = document.getElementById('msg');
  let token = null, tokenClient = null, 시트ID = null, 받는중 = null;
  let 이메일창 = null, 신분증받는중 = null, 내이메일 = null, 막힘 = null;   // 막힘: 승인이 안 됐을 때 보여 줄 것
  let 단위 = '일';               // 보고 있는 회고: '일' 또는 '주'
  let 보는날 = 자정(new Date());   // 주간일 때는 이 날이 든 주를 본다
  const 안쓴글 = new Map();   // 저장 안 한 글: 칸 열쇠 → 적은 글. 다시 그려도 남긴다

  const p2 = n => String(n).padStart(2,'0');
  function 자정(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function 날짜글(d) { return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
  function 지금() { const d=new Date(); return 날짜글(d)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
  function 날짜표시(d) { return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')'; }
  function 며칠차이(d) { return Math.round((d - 자정(new Date())) / 86400000); }
  function 새번호표(앞) { return 앞 + Math.random().toString(36).slice(2,8).padEnd(6,'0'); }
  // 알림은 화면 위쪽에 떠 있다 — 아래에 두면 휴대폰에서 안 보인다. 「저장됨」은 잠깐 떴다 사라진다
  let 알림타이머 = null;
  function 알림(text, cls) {
    clearTimeout(알림타이머); msg.innerHTML = ''; msg.style.display = text ? '' : 'none';
    if (!text) return;

      if (/Unable to parse range/.test(e.message))
        throw new Error('시트에서 탭을 못 찾았습니다: ' + 이름들.join(', ')
          + '\n탭 이름이 바뀌었을 수 있습니다. 원래 이름으로 되돌려 주세요. (저장하지 않았습니다)');
      throw e;
    }
    const 결과 = {};
    r.valueRanges.forEach((vr, i) => {
      const 이름 = 이름들[i], 줄들 = vr.values || [], 머리 = 줄들[0] || [];
      const 자리 = {};
      머리.forEach((칸, j) => { 자리[String(칸).trim()] = j; });
      const 없는칸 = 칸검사안함 ? [] : (필요칸[이름] || []).filter(n => !(n in 자리));
      if (없는칸.length) throw new Error('「'+이름+'」 탭에서 이 칸을 못 찾았습니다: '+없는칸.join(', ')
        + '\n칸 이름이 바뀌었을 수 있습니다. 원래 이름으로 되돌려 주세요. (저장하지 않았습니다)');
      const 값 = (행, 칸) => String(행[자리[칸]] == null ? '' : 행[자리[칸]]).trim();
      결과[이름] = { 자리, 머리: 머리.map(칸 => String(칸).trim()), 칸수: 머리.length, 행들: 줄들.slice(1), 값 };
    });
    return 결과;
  }

  function 열글자(i) { let s = ''; i++; while (i > 0) { const m = (i-1) % 26; s = String.fromCharCode(65+m) + s; i = Math.floor((i-1)/26); } return s; }

  // ── 쓰기: 쓰기 직전에 다시 읽어서 행을 찾는다. 행 위치를 기억하지 않는다 (원칙 5) ──
  async function 행찾아쓰기(탭, 찾기, 바꿀것, 없으면붙일것) {
    const t = (await 탭읽기([탭]))[탭];
    const i = t.행들.findIndex(행 => 찾기(행, t.값));
    if (i >= 0) {
      const 행번호 = i + 2;
      const data = Object.keys(바꿀것).map(칸 => ({ range:"'"+탭+"'!"+열글자(t.자리[칸])+행번호, values:[[바꿀것[칸]]] }));
      await api(시트API('/values:batchUpdate'), { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ valueInputOption:'RAW', data }) });
      return;
    }
    if (!없으면붙일것) throw new Error('고칠 줄을 시트에서 못 찾았습니다. 새로고침해 주세요.');
    await 행붙이기(탭, t, 없으면붙일것(t));
  }

  // 여러 행을 한 번 읽고 한 번에 고친다. 모두:true면 맞는 행을 전부, 아니면 첫 행만 (없으면 멈춘다).
  // 이름을 바꿀 때 석 달치 사본을 고쳐도 요청은 읽기 한 번 + 쓰기 한 번이다
  async function 고치기(탭, 일들) {
    const t = (await 탭읽기([탭]))[탭];
    const data = [];
    일들.forEach(일 => {
      const 번호들 = [];
      t.행들.forEach((행, i) => { if ((일.모두 || !번호들.length) && 일.찾기(행, t.값)) 번호들.push(i + 2); });
      if (!번호들.length && !일.모두) throw new Error('고칠 줄을 시트에서 못 찾았습니다. 새로고침해 주세요.');
      번호들.forEach(n => Object.keys(일.바꿀것).forEach(칸 =>
        data.push({ range:"'"+탭+"'!"+열글자(t.자리[칸])+n, values:[[일.바꿀것[칸]]] })));
    });
    if (!data.length) return;
    await api(시트API('/values:batchUpdate'), { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ valueInputOption:'RAW', data }) });
  }

  // 이름을 바꾸면 기록 행의 사본 칸도 함께 고친다. 앱은 번호표로 찾으므로 이게 실패해도 안 끊긴다 (8h.16)
  async function 사본고치기(종류, id, 새이름) {
    const 칸 = 종류 === '영역' ? '영역' : '주제', id칸 = 칸 + 'ID';
    const 일 = { 모두:true, 찾기:(행, 값) => 값(행, id칸) === id && 값(행, 칸) !== 새이름, 바꿀것:{ [칸]:새이름 } };
    await 고치기('계획항목', [일]);
    if (종류 === '영역') await 고치기('피드백', [일]);
  }

  async function 행붙이기(탭, t, 값들) {
    const 행 = new Array(t.칸수).fill('');
    Object.keys(값들).forEach(칸 => { 행[t.자리[칸]] = 값들[칸]; });
    await api(시트API('/values/' + encodeURIComponent("'"+탭+"'!A1") + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS'),
      { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ values:[행] }) });
  }

  // ── 기간 규칙 (설계 5-8) ──
  // 그 달의 4일이 든 주(월~일)가 그 달의 첫 주다. 분기는 1·4·7·10월 첫 주에서 시작하고,
  // 12주를 넘는 주는 재정비 주간(R)이다.
  const 하루 = 86400000;
  function 월요일(d) { const x = 자정(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
  function 분기시작(연, q) { return 월요일(new Date(연, (q-1)*3, 4)); }
  function 분기찾기(d) {
    const x = 자정(d);
    let 연 = x.getFullYear() + 1, q = 1;
    for (let k = 0; k < 6; k++) {   // 다음 해 1분기부터 거꾸로 훑는다
      const 시작 = 분기시작(연, q);
      if (시작 <= x) return { 연, q, 시작, 끝: q === 4 ? 분기시작(연+1, 1) : 분기시작(연, q+1) };
      if (--q === 0) { q = 4; 연--; }
    }
  }
  function 주정보(d) {
    const 분 = 분기찾기(d), 월 = 월요일(d);
    const n = Math.round((월 - 분.시작) / (7*하루)) + 1;
    const 재정비수 = Math.round((분.끝 - 분.시작) / (7*하루)) - 12;
    const 재정비 = n > 12, 번호 = 재정비 ? n - 12 : n;
    const 일요일 = new Date(월.getFullYear(), 월.getMonth(), 월.getDate() + 6);
    return {
      기간: 분.연 + '-Q' + 분.q + '-' + (재정비 ? 'R' + 번호 : 'W' + p2(번호)),
      이름: 분.q + '분기 ' + (재정비 ? '재정비 주간' + (재정비수 > 1 ? ' ' + 번호 + '/' + 재정비수 : '') : 번호 + '주차'),
      연: 분.연, 분기: 분.연 + '-Q' + 분.q, 월요일: 월,
      범위: (월.getMonth()+1) + '/' + 월.getDate() + ' ~ ' + (일요일.getMonth()+1) + '/' + 일요일.getDate()
    };
  }
  function 짧은날짜(d) { return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + '일월화수목금토'[d.getDay()] + ')'; }
  function 하루뒤(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  // 지금 보는 기간과, 그 화면이 참고로 띄울 상위 기간·지난 기간 (설계 6장 「참고」)
  function 지금보기() {
    const 오늘 = 자정(new Date());
    if (단위 === '일') {
      const 주 = 주정보(보는날), 전날 = 하루뒤(보는날, -1);
      return { 단위:'일', 기간: 날짜글(보는날), 제목: 날짜표시(보는날),
        꼬리: {'-1':'어제', '0':'오늘', '1':'내일'}[String(며칠차이(보는날))] || '',
        지금인가: 며칠차이(보는날) === 0, 안내: '항목 한 줄',
        상위: { 단위:'주', 기간: 주.기간, 이름: '주간 계획 · ' + 주.이름 },
        지난: { 단위:'일', 기간: 날짜글(전날), 이름: '전날 · ' + 짧은날짜(전날) } };
    }
    const 주 = 주정보(보는날), 전주 = 주정보(하루뒤(보는날, -7));
    const 차이 = Math.round((주.월요일 - 월요일(오늘)) / (7*하루));
    return { 단위:'주', 기간: 주.기간, 제목: 주.연 + '년 ' + 주.이름,
      꼬리: 주.범위 + ({'-1':' · 지난주', '0':' · 이번 주', '1':' · 다음 주'}[String(차이)] || ''),
      지금인가: 차이 === 0, 안내: '이번 주 항목 한 줄',
      상위: { 단위:'분기', 기간: 주.분기, 이름: '분기 계획 · ' + 주.연 + '년 ' + 주.분기.slice(-1) + '분기' },
      지난: { 단위:'주', 기간: 전주.기간, 이름: '전주 · ' + 전주.이름 } };
  }

  // ── 그 기간의 기록을 모은다 (참고할 상위·지난 기간까지 한 번에 읽는다) ──
  async function 모으기(보기) {
    const 탭들 = await 탭읽기(['영역설정','주제설정','계획항목','피드백','일기']);
    const 영 = 탭들['영역설정'], 주 = 탭들['주제설정'], 계 = 탭들['계획항목'], 피 = 탭들['피드백'], 일 = 탭들['일기'];
    const 살아있나 = (t, 행) => !t.값(행, '삭제됨');
    const 그기간 = (t, 행, 단, 간) => t.값(행,'기간 단위') === 단 && t.값(행,'기간') === 간 && 살아있나(t, 행);

    // 영역은 기간과 상관없이 다 읽어 둔다 — 설정 화면도 같은 자료를 쓴다
    const 영역전체 = 영.행들
      .filter(행 => 영.값(행,'영역ID') && 살아있나(영, 행))
      .map(행 => ({ id: 영.값(행,'영역ID'), 이름: 영.값(행,'이름'), 기본: 영.값(행,'기본/커스텀') === '기본',
        기간: Object.fromEntries(기간종류.map(([k]) => [k, 영.값(행, k) === 'O'])), 순서: Number(영.값(행,'순서')) || 0 }))
      .sort((a, b) => a.순서 - b.순서);

    // 지운 주제도 읽어 둔다 — 그 주제가 붙은 옛 항목은 그 이름을 달고 그대로 보인다 (설계 5-7-1)
    const 주제맵 = new Map();
    주.행들.forEach(행 => {
      const id = 주.값(행,'주제ID');
      if (!id || 주제맵.has(id)) return;
      주제맵.set(id, { id, 이름: 주.값(행,'이름'), 구분: 주.값(행,'구분'), 빼둠: 주.값(행,'상태') === '빼둠',
        색: 주.값(행,'색'), 순서: Number(주.값(행,'순서')) || 0, 지움: !살아있나(주, 행) });
    });
    const 주제항목수 = new Map();   // 빼 둔 주제를 제안할 때 「항목 12개」로 보인다
    계.행들.forEach(행 => { const id = 계.값(행,'주제ID'); if (id && 살아있나(계, 행)) 주제항목수.set(id, (주제항목수.get(id) || 0) + 1); });

    const 항목모으기 = (단, 간) => 계.행들.filter(행 => 그기간(계, 행, 단, 간)).map(행 => ({
      id: 계.값(행,'항목ID'), 영역ID: 계.값(행,'영역ID'), 주제ID: 계.값(행,'주제ID'), 주제사본: 계.값(행,'주제'), 계획: 계.값(행,'계획'),
      평가: 계.값(행,'평가'), 이월: Number(계.값(행,'이월횟수')) || 0, 순서: Number(계.값(행,'순서')) || 0
    })).sort((a, b) => a.순서 - b.순서);
    const 피드백모으기 = (단, 간) => {
      const 결과 = {};
      피.행들.filter(행 => 그기간(피, 행, 단, 간)).forEach(행 => {
        const id = 피.값(행,'영역ID');
        if (!(id in 결과)) 결과[id] = 피.값(행,'피드백');   // 같은 기간·영역에 두 줄이면 먼저 것을 쓴다
      });
      return 결과;
    };
    const 일기줄 = 일.행들.find(행 => 그기간(일, 행, 보기.단위, 보기.기간));
    return {
      영역전체, 주제맵, 주제항목수,
      항목들: 항목모으기(보기.단위, 보기.기간),
      피드백: 피드백모으기(보기.단위, 보기.기간),
      일기: 일기줄 ? 일.값(일기줄,'내용') : '',
      상위항목: 항목모으기(보기.상위.단위, 보기.상위.기간),
      지난항목: 항목모으기(보기.지난.단위, 보기.지난.기간),
      지난피드백: 피드백모으기(보기.지난.단위, 보기.지난.기간)
    };
  }

  // ── 주제 ──
  // 화면에 뜨는 이름은 설정 탭에서 가져온다. 기록 행의 「주제」 칸은 사람이 읽는 사본이다 (8h.16)
  const 주제이름 = h => { const z = 자료.주제맵.get(h.주제ID); return (z && z.이름) || h.주제사본 || ''; };
  // 한 구분의 주제들, 순서대로. 목록에있는것만이면 빼 둔 것은 뺀다. 지운 것은 늘 뺀다
  function 구분주제들(구분, 목록에있는것만) {
    return [...자료.주제맵.values()].filter(z => z.구분 === 구분 && !z.지움 && !(목록에있는것만 && z.빼둠))
      .sort((a, b) => a.순서 - b.순서);
  }
  // 칸에 적힌 색. 비었거나 모르는 글자면 구분 안의 순서대로 돌려 쓴다 (시트에 손으로 넣은 행의 안전망)
  function 색이름(z) {
    if (색들.some(c => c[0] === z.색)) return z.색;
    const i = 구분주제들(z.구분).indexOf(z);
    return 색들[(i < 0 ? 0 : i) % 색들.length][0];
  }
  const 주제색 = z => z ? 색들.find(c => c[0] === 색이름(z))[1] : '#b5b5b5';   // 설정에 없는 주제는 회색
  // 새 주제의 색: 그 구분에서 아직 안 쓴 색(자동색으로 보이는 것도 쓴 것으로 센다). 다 쓰였으면 가장 적게 쓴 색
  function 새색(구분) {
    const 셈 = new Map(색들.map(c => [c[0], 0]));
    구분주제들(구분).forEach(z => { const 이름 = 색이름(z); 셈.set(이름, 셈.get(이름) + 1); });
    let 고른 = 색들[0][0];
    색들.forEach(([이름]) => { if (셈.get(이름) < 셈.get(고른)) 고른 = 이름; });
    return 고른;
  }
  function 주제만들기(이름, 구분) {
    const z = { id: 새번호표('tp_'), 이름, 구분, 빼둠: false, 색: 새색(구분),
      순서: 구분주제들(구분).reduce((m, x) => Math.max(m, x.순서), 0) + 1, 지움: false };
    자료.주제맵.set(z.id, z);
    저장하기(async () => {
      const t = (await 탭읽기(['주제설정']))['주제설정'];
      await 행붙이기('주제설정', t, { '주제ID':z.id, '이름':z.이름, '구분':z.구분, '색':z.색, '순서':z.순서, '수정시각':지금() });
    }, () => '만들려던 주제: ' + 이름);
    return z;
  }
  // 빼 둔 주제를 목록에 다시 넣는다 — 같은 번호표라 옛 기록과 이어진다. 목록 맨 뒤로 간다
  function 다시넣기(z) {
    z.빼둠 = false;
    z.순서 = 구분주제들(z.구분, true).filter(x => x !== z).reduce((m, x) => Math.max(m, x.순서), 0) + 1;
    const 순서 = z.순서;
    저장하기(() => 고치기('주제설정', [{ 찾기:(행, v) => v(행,'주제ID') === z.id, 바꿀것:{ '상태':'', '순서':순서, '수정시각':지금() } }]));
  }

  // ── 그리기 ──
  // 시트에서 읽어 온 것(자료)을 들고 있다가, 손으로 바꾼 것은 화면부터 바로 고치고 저장은 뒤에서 한다.
  // 기다리는 저장이 끝나기 전에는 새로 읽지 않는다 — 읽으면 아직 안 들어간 것이 사라져 보인다.
  let 자료 = null, 보기 = null, 다시초점 = null;
  let 화면종류 = '회고';   // '회고' 또는 '설정'
  const 설정단추 = document.getElementById('설정단추');
  설정단추.addEventListener('click', () => 설정열기());

  async function 그리기(저장기다리기 = true) {

  // 저장은 한 줄로 세워 차례로 한다 (빨리 여러 번 눌러도 순서가 섞이지 않게).
  // 실패하면 시트를 다시 읽어 화면을 사실대로 되돌리고 크게 알린다 (원칙 3).
  // 합칠열쇠가 같은 쓰기가 줄에서 기다리고 있으면 앞의 것은 버리고 마지막 것만 보낸다 (8h.9) —
  // 평가를 ○→△→✕로 빨리 바꿔도 시트에 남을 것은 마지막 값뿐이다. 그래서 그런 쓰기는 늘 전체 값을 쓴다
  let 저장줄 = Promise.resolve(), 남은저장 = 0, 저장실패 = null, 실패덧글 = [];
  const 마지막쓰기 = new Map();

  }

  function 날짜카드(보기) {

  function 넘겨도되나() {

  function 달성률(항목들) {

    if (!평가한것.length) return null;   // 하나도 평가 안 했으면 보여주지 않는다 (설계 6장)
    const 합 = 평가한것.reduce((s, h) => s + 평가점수[h.평가], 0);
    return Math.round(합 / 항목들.length * 100);   // 미평가도 분모에 넣는다
  }
  const 기호 = 평가 => (평가모양.find(([값]) => 값 === 평가) || [null, '·'])[1];

  // 접은 참고는 이 기기에서 기억한다. 기본은 펼침 (개발결정로그 8h.5)
  const 접음키 = 'pronote_참고접음';
  function 접은것() { try { return new Set(JSON.parse(localStorage.getItem(접음키) || '[]')); } catch (e) { return new Set(); } }
  function 접음바꾸기(열쇠, 접나) {
    const s = 접은것(); 접나 ? s.add(열쇠) : s.delete(열쇠);

  }

  // 일간에서는 그 주의 주간 계획을 늘 보인다 — 접지 않고, 비어 있으면 「주간 계획 없음」 (사용자, 2026-10-04).
  // 전날 기록은 아래 「참고」에서 접을 수 있다
  function 참고블록(영역, 자료, 보기) {
    const 상위 = 자료.상위항목.filter(h => h.영역ID === 영역.id);
    if (보기.단위 === '일' && 영역.기간.주) {

      const 고정 = 요소('div','참고');

        고정.appendChild(줄);

      묶음.appendChild(고정);
      const 나머지 = 참고접는칸(영역, 자료, 보기, []);
      if (나머지) 묶음.appendChild(나머지);
      return 묶음;
    }
    return 참고접는칸(영역, 자료, 보기, 상위);
  }

  function 참고접는칸(영역, 자료, 보기, 상위) {
    const 지난 = 자료.지난항목.filter(h => h.영역ID === 영역.id);

    if (!상위.length && !지난.length && !지난피드백) return null;   // 참고할 것이 없으면 줄째 안 보인다

    const 틀 = 요소('div','참고');

    if (지난.length) {
      const 셈 = {}; 지난.forEach(h => { const k = 기호(h.평가); 셈[k] = (셈[k] || 0) + 1; });

    const 요약칸 = 요소('span', null, 요약.join(' · '));
    const 그리머리 = () => { 머리.firstChild.textContent = '참고 ' + (접힘 ? '▸' : '▾'); 요약칸.style.display = 접힘 ? '' : 'none'; 몸.style.display = 접힘 ? 'none' : ''; };
    머리.append(document.createTextNode(''), 요약칸);
    머리.addEventListener('click', () => { 접힘 = !접힘; 접음바꾸기(열쇠, 접힘); 그리머리(); });

    const 목록 = (제목, 항목들) => {
      몸.appendChild(요소('div','참고제목', 제목));

  function 영역카드(영역, 자료, 보기) {

    // 계획 제목 옆 「순서」 — 누르면 평가 단추 자리에 ▲▼가 나와 항목·주제 순서를 바꾼다
    const 순서중 = 순서모드.has(영역.id);

      제목줄.appendChild(순서단추);
    }
    card.appendChild(제목줄);
    // 주제 없는 항목은 제목 없이 맨 위 (8h.15). 그 아래 주제 묶음, 맨 아래 입력칸
    const 덩어리들 = [];   // 화면에 보이는 차례대로의 항목 묶음들 — 순서를 바꾸면 이 차례로 1, 2, 3… 다시 매긴다
    const 목록 = 묶음항목들 => {

        아래: i < 묶음항목들.length - 1 ? () => 항목옮기기(영역, 덩어리들, 묶음항목들, i, 1) : null })));
      return ul;
    };
    const 주제없는 = 항목들.filter(h => !h.주제ID);
    if (주제없는.length) card.appendChild(목록(주제없는));
    // 이 기간에 항목이 붙은 주제만 묶음으로 보인다 — 목록에 있는 주제 순서대로, 빼 둔·지운 주제는 그 뒤에
    const 구분 = 영역구분(영역.id);
    const 목록주제 = 구분주제들(구분, true);
    const 붙은ID = new Set(항목들.map(h => h.주제ID).filter(Boolean));
    const 보이는목록주제 = 목록주제.filter(z => 붙은ID.has(z.id));
    const 차례 = 보이는목록주제.map(z => z.id).concat([...붙은ID].filter(id => !목록주제.some(z => z.id === id)));
    차례.forEach(id => {
      const k = 보이는목록주제.findIndex(z => z.id === id);
      const 옮김 = !순서중 || k < 0 ? null : {
        위: k > 0 ? () => 주제끼워옮기기(구분, 보이는목록주제[k], 보이는목록주제[k - 1], -1) : null,
        아래: k < 보이는목록주제.length - 1 ? () => 주제끼워옮기기(구분, 보이는목록주제[k], 보이는목록주제[k + 1], 1) : null };
      card.appendChild(주제묶음(id, 항목들.filter(h => h.주제ID === id), 영역, 목록, 옮김));
    });
    if (순서중 && 보이는목록주제.length > 1) card.appendChild(요소('div','안내글',
      '주제 순서는 ' + (구분 === '목표·실행' ? '핵심 목표·실행 초점의 모든 기간' : '이 영역의 모든 기간') + '에 함께 적용됩니다.'));
    card.appendChild(추가줄(영역));

    // 피드백 — 항목이 있거나 이미 쓴 글이 있을 때만 펼친다 (처음 켠 사람의 화면을 가볍게)
    const 쓴글 = 자료.피드백[영역.id] || '';
    const 단 = 보기.단위, 간 = 보기.기간;
    const 칸 = 글칸(영역.id, '피드백', 쓴글, '무엇이 잘 됐고 무엇이 막혔나', 글 => {
      자료.피드백[영역.id] = 글;
      return () => 행찾아쓰기('피드백',
        (행, 값) => 값(행,'기간 단위')===단 && 값(행,'기간')===간 && 값(행,'영역ID')===영역.id && !값(행,'삭제됨'),
        { '피드백':글, '수정시각':지금() },
        () => ({ '피드백ID':새번호표('fb_'), '기간 단위':단, '기간':간, '영역ID':영역.id, '영역':영역.이름,
                 '피드백':글, '수정시각':지금() }));
    });
    if (항목들.length || 쓴글 || 안쓴글.has(영역.id)) card.appendChild(칸);
    else {
      const 열기 = 요소('button','글자단추','피드백 쓰기');
      열기.addEventListener('click', () => { 열기.replaceWith(칸); 칸.querySelector('textarea').focus(); });
      card.appendChild(열기);
    }
    return card;
  }

    card.appendChild(요소('div','영역이름','주제'));
    if (주제안내보임) {
      const 알려줌 = 요소('div','알려줌', '회고 화면에서 항목을 추가할 때 입력칸을 누르면 주제를 고를 수 있습니다. 이미 적은 항목은 눌러서 주제를 붙이거나 바꿉니다.');
      const 알겠음 = 요소('button', null, '알겠습니다');
      알겠음.addEventListener('click', () => {
        주제안내보임 = false;
        try { localStorage.setItem(주제안내키, '1'); } catch (e) {}
        화면그리기();
      });
      알려줌.appendChild(알겠음);
      card.appendChild(알려줌);
    }
    const 묶음들 =[['목표·실행','핵심 목표·실행 초점'],['체질','체질 초점']]
      .concat(자료.영역전체.filter(a => !a.기본).map(a => [a.id, a.이름]));
    묶음들.forEach(([구분, 제목]) => {
      card.appendChild(요소('div','묶음제목', 제목));
      const 목록 = 구분주제들(구분, true);
      목록.forEach((z, i) => {
        if (설정편집 === '주제:' + z.id) { card.appendChild(주제고치기틀(z)); return; }
        const 줄 = 요소('div','설정줄');
        const 점단추 = 요소('button','점단추'); 점단추.setAttribute('aria-label', '색 바꾸기');
        const 점 = 요소('span','점'); 점.style.background = 주제색(z); 점단추.appendChild(점);
        점단추.addEventListener('click', () => 편집(설정편집 === '색:' + z.id ? null : '색:' + z.id));
        줄.append(점단추, 요소('div','이름', z.이름),
          네모('▲','위로', () => 주제옮기기(구분, i, -1), i === 0),
          네모('▼','아래로', () => 주제옮기기(구분, i, 1), i === 목록.length - 1),
          네모('✎','고치기', () => 편집('주제:' + z.id)));
        card.appendChild(줄);
        if (설정편집 === '색:' + z.id) card.appendChild(색판(z));
      });
      if (설정편집 === '새주제:' + 구분) card.appendChild(새주제틀(구분));
      else {
        const 더하기 = 요소('button','글자단추','+ 주제 추가');
        더하기.addEventListener('click', () => 편집('새주제:' + 구분));
        card.appendChild(더하기);
      }
    });

    // 빼 둔 주제 — 지운 영역의 것은 안 보인다 (주제 행은 시트에 남는다)
    const 묶음이름 = new Map(묶음들);
    const 빼둔 = [...자료.주제맵.values()].filter(z => z.빼둠 && !z.지움 && 묶음이름.has(z.구분));
    if (빼둔.length) {
      const 머리 = 요소('button','글자단추', '빼 둔 주제 (' + 빼둔.length + ') ' + (빼둔펼침 ? '⌄' : '›'));
      머리.style.cssText = 'display:block;margin-top:12px';
      머리.addEventListener('click', () => { 빼둔펼침 = !빼둔펼침; 화면그리기(); });
      card.appendChild(머리);
      if (빼둔펼침) 빼둔.forEach(z => {
        const 틀 = 요소('div','고치기틀');
        if (설정편집 === '빼둔이름:' + z.id) { 틀.appendChild(이름고치기(z)); card.appendChild(틀); return; }
        const 줄 = 요소('div','주제');
        const 점 = 요소('span','점'); 점.style.background = 주제색(z);
        줄.append(점, document.createTextNode(z.이름));
        줄.style.cssText = 'font-size:14px;color:var(--fg);font-weight:400;margin:0';
        틀.append(줄, 요소('div','안내글', 묶음이름.get(z.구분) + ' · 항목 ' + (자료.주제항목수.get(z.id) || 0) + '개'));
        const 단추줄 = 요소('div','단추줄');
        const 이름단추 = 요소('button','옅은단추','이름 바꾸기');
        이름단추.addEventListener('click', () => 편집('빼둔이름:' + z.id));
        const 넣기 = 요소('button','옅은단추','다시 넣기');
        넣기.addEventListener('click', () => { 다시넣기(z); 화면그리기(); });
        단추줄.append(이름단추, 넣기, 주제지우기단추(z));
        틀.appendChild(단추줄);
        card.appendChild(틀);
      });
    }
    return card;
  }

  // 이름 바꾸기 틀 — 저장하면 주제설정의 이름과 기록 행의 사본을 함께 고친다
  // 설정과 회고 화면(주제 묶음 제목)이 함께 쓴다. 닫기를 안 주면 설정의 고치기 틀을 닫는다
  function 이름고치기(z, 덧단추들, 닫기) {
    const 편집 = 닫기 ? (() => 닫기()) : (() => { 설정편집 = null; 화면그리기(); });
    const 묶음 = 요소('div');
    const inp = 요소('input'); inp.type = 'text'; inp.maxLength = 40; inp.value = z.이름;
    const 단추줄 = 요소('div','단추줄');
    const 저장 = 요소('button','작은단추','저장');
    const 취소 = 요소('button','옅은단추','취소');
    저장.addEventListener('click', () => {
      const 이름 = inp.value.trim();
      if (!이름) { inp.focus(); return; }
      if (이름 === z.이름) { 편집(null); return; }
      const 옛이름 = z.이름;
      z.이름 = 이름; 편집(null);
      저장하기(async () => {
        await 고치기('주제설정', [{ 찾기:(행, v) => v(행,'주제ID') === z.id, 바꿀것:{ '이름':이름, '수정시각':지금() } }]);
        await 사본고치기('주제', z.id, 이름);
      }, () => '바꾸려던 이름: ' + 이름 + ' (원래: ' + 옛이름 + ')');
    });
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing) 저장.click(); });
    취소.addEventListener('click', () => 편집(null));
    단추줄.append(저장, ...(덧단추들 || []), 취소);
    묶음.append(inp, 단추줄);
    return 묶음;
  }

  function 주제지우기단추(z) {
    const b = 요소('button','옅은단추 지우기단추','지우기');
    b.addEventListener('click', () => {
      if (!confirm('「' + z.이름 + '」 주제를 지울까요?\n옛 항목은 이 주제 이름을 단 채 그대로 보이지만, 새 주제를 만들 때 이어 쓰기 제안에는 다시 뜨지 않습니다.\n시트에는 그대로 남습니다.')) return;
      z.지움 = true; 편집(null);
      저장하기(() => 고치기('주제설정', [{ 찾기:(행, v) => v(행,'주제ID') === z.id, 바꿀것:{ '삭제됨':'삭제', '수정시각':지금() } }]));
    });
    return b;
  }

  function 주제고치기틀(z) {
    const 틀 = 요소('div','고치기틀');
    const 빼기 = 요소('button','옅은단추','목록에서 빼기');
    빼기.addEventListener('click', () => {
      z.빼둠 = true; 편집(null);
      저장하기(() => 고치기('주제설정', [{ 찾기:(행, v) => v(행,'주제ID') === z.id, 바꿀것:{ '상태':'빼둠', '수정시각':지금() } }]));
    });
    틀.append(이름고치기(z, [빼기, 주제지우기단추(z)]),
      요소('div','안내글','목록에서 빼면 회고 화면에 안 나옵니다. 옛 기록은 그대로이고, 새 주제를 만들 때 이어 쓰기로 제안됩니다.'));
    return 틀;
  }

  function 색판(z) {
    const 판 = 요소('div','색판');
    색들.forEach(([이름, 색조]) => {
      const b = 요소('button', 색이름(z) === 이름 ? '골라짐' : null);
      const 점 = 요소('span','점'); 점.style.background = 색조;
      b.append(점, document.createTextNode(이름));
      b.addEventListener('click', () => {
        z.색 = 이름; 편집(null);
        저장하기(() => 고치기('주제설정', [{ 찾기:(행, v) => v(행,'주제ID') === z.id, 바꿀것:{ '색':이름, '수정시각':지금() } }]),
          null, '색:' + z.id);
      });
      판.appendChild(b);
    });
    return 판;
  }

  function 새주제틀(구분) {
    const 틀 = 요소('div','고치기틀');
    const 줄 = 요소('div','입력줄');
    const inp = 요소('input'); inp.type = 'text'; inp.maxLength = 40; inp.placeholder = '주제 이름 (예: 신앙)';
    const 추가 = 요소('button','작은단추','추가');
    const 취소 = 요소('button','옅은단추','취소');
    줄.append(inp, 추가, 취소);
    const 제안칸 = 요소('div');
    inp.addEventListener('input', () => {
      제안칸.innerHTML = '';
      const 글 = inp.value.trim();
      if (!글) return;
      구분주제들(구분).filter(z => z.빼둠 && z.이름.includes(글)).forEach(z => {
        const 한줄 = 요소('div','제안', '전에 쓴 「' + z.이름 + '」 항목 ' + (자료.주제항목수.get(z.id) || 0) + '개');
        const 넣기 = 요소('button', null, '다시 넣기');
        넣기.addEventListener('click', () => { 다시넣기(z); 편집(null); });
        한줄.appendChild(넣기);
        제안칸.appendChild(한줄);
      });
    });
    const 만들기 = () => {
      const 이름 = inp.value.trim();
      if (!이름) { inp.focus(); return; }
      if (구분주제들(구분, true).some(z => z.이름 === 이름)) { 알림('「' + 이름 + '」 주제가 이미 있습니다.','err'); return; }
      주제만들기(이름, 구분);
      if (!주제안내본적()) 주제안내보임 = true;
      편집(null);
    };
    추가.addEventListener('click', 만들기);
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing) 만들기(); });
    취소.addEventListener('click', () => 편집(null));
    틀.append(줄, 제안칸);
    setTimeout(() => inp.focus(), 0);
    return 틀;
  }

  function 주제옮기기(구분, i, d) {
    const 목록 = 구분주제들(구분, true);
    [목록[i], 목록[i + d]] = [목록[i + d], 목록[i]];
    주제순서저장(구분, 목록);
  }

  // 저장 중이거나 저장 안 한 글이 있으면 떠나기 전에 묻는다
  window.addEventListener('beforeunload', ev => { if (안쓴글.size || 남은저장) { ev.preventDefault(); ev.returnValue = ''; } });
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
