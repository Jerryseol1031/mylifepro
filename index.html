<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로 노트</title>
<style>
  :root { --bg:#f7f6f3; --fg:#1f1f1f; --muted:#6b6b6b; --accent:#2f5d50; --err:#b3261e; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  main { width: 100%; max-width: 360px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 0 0 40px; font-size: 15px; }
  button {
    width: 100%; padding: 16px; font-size: 17px; font-weight: 600;
    border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 24px; font-size: 16px; line-height: 1.6; min-height: 1.6em; }
  #msg.error { color: var(--err); font-size: 14px; text-align: left; white-space: pre-wrap; }
  .hello { font-size: 20px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>프로 노트</h1>
  <p class="sub">나의 삶의 프로</p>
  <button id="login" disabled>구글로 로그인</button>
  <div id="msg">불러오는 중…</div>
</main>

<script>
  // 구글에서 발급받은 앱 이름표(클라이언트 ID). 공개돼도 되는 값이다.
  // 등록된 주소(jerryseol1031.github.io)에서만 작동한다.
  const CLIENT_ID = '297972351948-2fq40d61rpp8dngqmg36mn5kqhnp2ebq.apps.googleusercontent.com';

  // 이 앱이 요청하는 권한은 이것 하나뿐이다: "이 앱이 만든 파일만" (drive.file)
  const SCOPE = 'https://www.googleapis.com/auth/drive.file';

  const loginBtn = document.getElementById('login');
  const msg = document.getElementById('msg');
  let tokenClient = null;

  function show(text, isError) {
    msg.className = isError ? 'error' : '';
    msg.textContent = text;
  }

  // 구글 로그인 도구가 다 불러와지면 실행된다
  function initGoogle() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: onToken,
      error_callback: function (err) {
        loginBtn.disabled = false;
        if (err && err.type === 'popup_closed') { show('로그인 창이 닫혔습니다. 다시 눌러 주세요.'); return; }
        if (err && err.type === 'popup_failed_to_open') { show('로그인 창이 열리지 않았습니다.\n브라우저의 팝업 차단을 풀고 다시 눌러 주세요.', true); return; }
        show('로그인 중 문제가 생겼습니다.\n' + JSON.stringify(err), true);
      }
    });
    loginBtn.disabled = false;
    show('');
  }

  loginBtn.addEventListener('click', function () {
    if (!tokenClient) return;
    loginBtn.disabled = true;
    show('로그인 창을 여는 중…');
    tokenClient.requestAccessToken();
  });

  // 로그인이 끝나고 구글이 '출입증'을 돌려주면 실행된다
  async function onToken(resp) {
    if (resp.error) {
      loginBtn.disabled = false;
      show('구글이 로그인을 거절했습니다.\n' + resp.error + (resp.error_description ? '\n' + resp.error_description : ''), true);
      return;
    }

    // 참가자가 동의 화면에서 드라이브 권한 체크를 풀었을 수 있다
    if (!google.accounts.oauth2.hasGrantedAllScopes(resp, SCOPE)) {
      loginBtn.disabled = false;
      show('드라이브 권한에 동의해야 기록을 저장할 수 있습니다.\n다시 로그인하면서 권한 체크를 켜 주세요.', true);
      return;
    }

    // 드라이브에 "나는 누구인가"를 물어서 이름을 받아온다.
    // drive.file 권한만으로 된다 — 이름을 얻으려고 권한을 더 요청하지 않는다.
    try {
      const r = await fetch('https://www.googleapis.com/drive/v3/about?fields=user(displayName,emailAddress)', {
        headers: { Authorization: 'Bearer ' + resp.access_token }
      });
      if (!r.ok) throw new Error('드라이브 응답 ' + r.status + '\n' + (await r.text()));
      const data = await r.json();
      const name = (data.user && data.user.displayName) || '이름 없음';
      loginBtn.style.display = 'none';
      msg.className = '';
      msg.innerHTML = '';
      const hello = document.createElement('div');
      hello.className = 'hello';
      hello.textContent = '안녕하세요, ' + name + '님';
      msg.appendChild(hello);
    } catch (e) {
      loginBtn.disabled = false;
      show('로그인은 됐지만 이름을 가져오지 못했습니다.\n' + e.message, true);
    }
  }
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()" onerror="show('구글 로그인 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.', true)"></script>
</body>
</html>
