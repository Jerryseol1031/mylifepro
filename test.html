<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로 노트 — 시험</title>
<style>
  :root { --bg:#f7f6f3; --fg:#1f1f1f; --muted:#6b6b6b; --accent:#2f5d50; --err:#b3261e; --ok:#1e6b3a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); padding:24px;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width:420px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 24px; line-height:1.6; }
  button { width:100%; padding:14px; font-size:16px; font-weight:600; border:0; border-radius:10px;
    background:var(--accent); color:#fff; cursor:pointer; margin-bottom:10px; }
  button.ghost { background:#fff; color:var(--fg); border:1px solid #ddd; }
  button:disabled { opacity:.5; cursor:default; }
  #log { margin-top:20px; font-size:13px; line-height:1.7; white-space:pre-wrap;
    background:#fff; border:1px solid #e5e3de; border-radius:10px; padding:14px; min-height:80px; }
  .ok { color:var(--ok); font-weight:600; }
  .err { color:var(--err); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>프로 노트 — 시험용 화면</h1>
  <p class="sub">앱이 <b>예전에 만든 자기 파일을 다시 찾을 수 있는지</b> 확인하는 화면입니다.<br>
  ① 만들기 → ② 페이지 새로고침 → ③ 찾기 순서로 눌러 주세요.</p>

  <button id="create" disabled>① 시험 파일 만들기</button>
  <button id="find" class="ghost" disabled>② 다시 찾기</button>
  <button id="trash" class="ghost" disabled>③ 시험 파일 휴지통으로 보내기</button>

  <div id="log">준비 중…</div>
</main>

<script>
  const CLIENT_ID = '297972351948-2fq40d61rpp8dngqmg36mn5kqhnp2ebq.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const MARK_KEY = 'pronote';           // 앱만 볼 수 있는 표시
  const MARK_VALUE = 'test';

  const logBox = document.getElementById('log');
  const btnCreate = document.getElementById('create');
  const btnFind = document.getElementById('find');
  const btnTrash = document.getElementById('trash');
  let tokenClient = null, token = null, pending = null;

  function log(text, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    logBox.appendChild(line);
  }
  function clearLog() { logBox.textContent = ''; }

  function initGoogle() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPE,
      callback: function (resp) {
        if (resp.error) { log('로그인 거절: ' + resp.error, 'err'); return; }
        token = resp.access_token;
        const job = pending; pending = null;
        if (job) job();
      },
      error_callback: function (err) { log('로그인 문제: ' + JSON.stringify(err), 'err'); }
    });
    btnCreate.disabled = false; btnFind.disabled = false; btnTrash.disabled = false;
    logBox.textContent = '준비됐습니다. ① 부터 눌러 주세요.';
  }

  function withToken(job) {
    if (token) { job(); return; }
    pending = job;
    tokenClient.requestAccessToken();
  }

  async function api(url, options) {
    const opt = options || {};
    opt.headers = Object.assign({ Authorization: 'Bearer ' + token }, opt.headers || {});
    const r = await fetch(url, opt);
    const text = await r.text();
    if (!r.ok) throw new Error(r.status + ' ' + text);
    return text ? JSON.parse(text) : {};
  }

  btnCreate.addEventListener('click', function () {
    withToken(async function () {
      clearLog(); log('① 시험 파일을 만드는 중…');
      try {
        const body = {
          name: '프로 노트 시험 파일 (지워도 됩니다)',
          mimeType: 'application/vnd.google-apps.spreadsheet',
          appProperties: { [MARK_KEY]: MARK_VALUE }   // 앱만 읽을 수 있는 표시를 붙인다
        };
        const f = await api('https://www.googleapis.com/drive/v3/files?fields=id,name', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        log('만들었습니다.', 'ok');
        log('파일 이름: ' + f.name);
        log('파일 번호: ' + f.id);
        log('');
        log('이제 이 페이지를 새로고침한 뒤 ②를 눌러 주세요.');
      } catch (e) { log('실패: ' + e.message, 'err'); }
    });
  });

  btnFind.addEventListener('click', function () {
    withToken(async function () {
      clearLog(); log('② 앱이 만든 파일을 찾는 중…');
      try {
        const q = encodeURIComponent("appProperties has { key='" + MARK_KEY + "' and value='" + MARK_VALUE + "' } and trashed = false");
        const r = await api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)');
        const files = r.files || [];
        if (files.length === 0) {
          log('못 찾았습니다. (0개)', 'err');
          log('이 방법으로는 앱이 자기 시트를 다시 찾을 수 없다는 뜻입니다.');
        } else {
          log('찾았습니다. ' + files.length + '개', 'ok');
          files.forEach(function (f) { log('· ' + f.name + '  (' + f.id + ')'); });
          log('');
          log('앱이 자기 시트를 다시 찾을 수 있습니다.');
        }
      } catch (e) { log('실패: ' + e.message, 'err'); }
    });
  });

  btnTrash.addEventListener('click', function () {
    withToken(async function () {
      clearLog(); log('③ 시험 파일을 휴지통으로 보내는 중…');
      try {
        const q = encodeURIComponent("appProperties has { key='" + MARK_KEY + "' and value='" + MARK_VALUE + "' } and trashed = false");
        const r = await api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)');
        const files = r.files || [];
        if (files.length === 0) { log('보낼 파일이 없습니다.'); return; }
        for (const f of files) {
          await api('https://www.googleapis.com/drive/v3/files/' + f.id, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trashed: true })
          });
          log('휴지통으로: ' + f.name, 'ok');
        }
        log('');
        log('완전히 지우려면 드라이브 휴지통에서 비우시면 됩니다.');
      } catch (e) { log('실패: ' + e.message, 'err'); }
    });
  });
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
</body>
</html>
